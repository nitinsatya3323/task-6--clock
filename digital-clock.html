<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7ff 0%, #e8f0fe 50%, #fdf2f8 100%);
      color: #1f2a44;
    }

    .clock-card {
      width: 100%;
      max-width: 640px;
      padding: 48px 32px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e3e8f5;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(80, 100, 160, 0.15);
    }

    .title {
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #7a86a8;
      margin-bottom: 24px;
    }

    .time {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: clamp(2.6rem, 12vw, 5.5rem);
      color: #2f4bd1;
      letter-spacing: 2px;
    }

    .colon {
      animation: blink 1s steps(1) infinite;
      color: #8fa2f0;
    }

    .period {
      font-size: clamp(1rem, 4vw, 1.8rem);
      font-weight: 600;
      color: #e0508a;
      margin-left: 6px;
    }

    .date {
      margin-top: 24px;
      font-size: clamp(1rem, 3.5vw, 1.4rem);
      color: #4a5778;
    }

    @keyframes blink {
      50% { opacity: 0.25; }
    }
  </style>
</head>
<body>
  <main class="clock-card">
    <div class="title">Digital Clock</div>
    <div class="time" id="time">
      <span id="hours">00</span>
      <span class="colon">:</span>
      <span id="minutes">00</span>
      <span class="colon">:</span>
      <span id="seconds">00</span>
      <span class="period" id="period">AM</span>
    </div>
    <div class="date" id="date"></div>
  </main>

  <script>
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");
    const periodEl = document.getElementById("period");
    const dateEl = document.getElementById("date");

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function updateClock() {
      const now = new Date();
      let h = now.getHours();
      const period = h >= 12 ? "PM" : "AM";
      h = h % 12 || 12;

      hoursEl.textContent = pad(h);
      minutesEl.textContent = pad(now.getMinutes());
      secondsEl.textContent = pad(now.getSeconds());
      periodEl.textContent = period;

      dateEl.textContent = now.toLocaleDateString("en-US", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
